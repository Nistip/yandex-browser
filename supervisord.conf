[supervisord]
nodaemon=true

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_VNC_SCREEN_SIZE)sx24
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -localhost -forever -rfbauth /home/app/.vnc/passwd
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:yandex-browser]
command=/usr/bin/yandex-browser-stable --no-sandbox --disable-gpu --disable-dev-shm-usage
environment=DISPLAY=":1"
priority=40
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock